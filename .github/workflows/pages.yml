name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Pages
        uses: actions/configure-pages@v5
      - name: Montar site estático
        run: |
          mkdir -p _site/Css _site/Js _site/Defs _site/debug
          cp index.html categorias.html header.html _site/
          cp -r Css/* _site/Css/
          cp -r Js/* _site/Js/
          cp -r Defs/* _site/Defs/
          cp debug/debug.html debug/debug.js _site/debug/
      - name: Empacotar site estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4