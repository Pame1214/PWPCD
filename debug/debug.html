<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagnóstico do banco | PWPCD</title>
  <link rel="stylesheet" href="../Css/css_idx.css">
</head>
<body>
  <div class="app-shell">
    <aside class="side-panel is-collapsed" aria-label="Menu lateral">
      <button type="button" class="panel-toggle" aria-label="Abrir ou fechar menu lateral" aria-expanded="false"><span class="panel-toggle__arrow">›</span></button>
      <div class="side-panel__login"><a class="login-button" href="../index.html#login">Login</a></div>
      <div class="side-panel__top"><span class="side-panel__label">Menu</span></div>
      <nav class="side-panel__nav" aria-label="Navegação lateral">
        <a class="side-panel__button" href="../index.html">Início</a>
        <a class="side-panel__button" href="../categorias.html">Categorias</a>
      </nav>
    </aside>
    <div class="content-area">
      <header id="site-header" class="site-header"></header>
      <main class="debug-main">
        <section class="debug-card" aria-labelledby="debug-title">
          <h2 id="debug-title">Diagnóstico do banco</h2>
          <label for="admin-token">Chave administrativa</label>
          <input id="admin-token" type="password" autocomplete="off" spellcheck="false" required>
          <div class="debug-actions">
            <button class="debug-read" id="health-button" type="button">Testar conexão</button>
            <button class="debug-read" id="read-button" type="button">Ler registros</button>
          </div>
          <div class="debug-divider"></div>
          <form id="debug-form" method="post" action="/api/db/write">
            <label for="message">Mensagem</label>
            <textarea id="message" rows="4" maxlength="5000" required></textarea>
            <label for="origin">Origem</label>
            <input id="origin" value="debug" maxlength="120">
            <label for="record-id">ID para atualizar ou excluir</label>
            <input id="record-id" inputmode="numeric" pattern="[1-9][0-9]{0,18}">
            <div class="debug-actions">
              <button class="login-submit" type="submit" value="write">Gravar registro</button>
              <button class="debug-read" type="submit" value="update">Atualizar registro</button>
              <button class="debug-danger" id="delete-button" type="button">Excluir registro</button>
            </div>
          </form>
          <p id="debug-status" class="debug-status" role="status" aria-live="polite"></p>
          <pre id="debug-output" class="debug-output" aria-label="Resultado da requisição"></pre>
        </section>
      </main>
    </div>
  </div>
  <script src="../Js/js_idx.js"></script>
  <script src="debug.js"></script>
</body>
</html>
